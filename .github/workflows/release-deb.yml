name: Build arm64 .deb and attach to release

on:
  push:
    tags:
      - "2.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (leave empty to only build an artifact)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: deb-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deb:
    uses: ./.github/workflows/deb-build.yml
    permissions:
      contents: write
    with:
      # tag push -> the tag name; manual run -> the tag input (may be empty)
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      publish: ${{ github.event_name == 'push' || inputs.tag != '' }}
