name: Build arm64 .deb (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build, also used as the Debian version. Empty = build the calling ref."
        required: false
        type: string
      publish:
        description: "Create/update the GitHub release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  deb-arm64:
    name: .deb (arm64)
    # Native arm64 hosted runner: no qemu, no emulation.
    runs-on: ubuntu-24.04-arm
    # Build inside the same distribution family as the target devices so
    # dependency and library versions line up with Devuan excalibur /
    # Debian 13.
    container: debian:trixie
    steps:
      # actions/checkout needs git inside the container
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkgconf python3-dev \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            qt6-webengine-dev qt6-webengine-dev-tools qt6-l10n-tools qt6-svg-dev \
            libqt6webenginecore6-bin \
            libhunspell-dev libpcre2-dev libminizip-dev zlib1g-dev libssl-dev \
            xz-utils jq \
            xvfb xauth x11-utils libgl1

      - name: Build the package
        env:
          DEB_VERSION: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "DEB_VERSION=${DEB_VERSION:-<default from CMakeLists>}"
          packaging/deb/build-deb.sh
          ls -l dist/

      - name: Smoke test
        run: |
          apt-get install -y --no-install-recommends ./dist/sigil_*.deb
          # every shared library must resolve
          if ldd /usr/lib/*/sigil/sigil | grep -q "not found"; then
            echo "!! unresolved shared libraries:"; ldd /usr/lib/*/sigil/sigil | grep "not found"; exit 1
          fi
          # Sigil has no --version flag: start the GUI on a virtual display and
          # require that it is still alive after 25s (i.e. no startup crash).
          export QTWEBENGINE_DISABLE_SANDBOX=1 LIBGL_ALWAYS_SOFTWARE=1
          Xvfb :99 -screen 0 1400x1000x24 >/tmp/xvfb.log 2>&1 &
          sleep 2
          export DISPLAY=:99
          setsid sigil >/tmp/sigil.log 2>&1 &
          sleep 25
          if ! pgrep -f '/sigil/sigil$' >/dev/null; then
            echo "!! sigil exited during startup"
            echo "----- sigil.log -----"; cat /tmp/sigil.log || true
            echo "----- xvfb.log -----";  cat /tmp/xvfb.log || true
            exit 1
          fi
          echo "OK: sigil is running"
          xwininfo -root -children | head -20 || true
          pkill -f '/sigil/sigil$' || true
          dpkg -s sigil | grep -E "^(Version|Depends|Installed-Size):"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sigil-deb-arm64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub release
        if: inputs.publish && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tag="${{ inputs.tag }}"
          deb=$(ls dist/*.deb | head -1)
          name=$(basename "$deb")
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          hdr=(-H "Authorization: Bearer $GH_TOKEN"
               -H "Accept: application/vnd.github+json"
               -H "X-GitHub-Api-Version: 2022-11-28")
          echo "Releasing $tag with $name"

          # Job logs need auth to read, but ::error:: annotations are public.
          # Every failure therefore carries the HTTP status and response body.
          fail() {
            printf '::error::%s\n' "$(printf '%s' "$1" | tr '\n' ' ' | tr -s ' ' | cut -c1-900)"
            exit 1
          }

          # 1. can this token write to the repository?
          code=$(curl -sS -o /tmp/repo.json -w '%{http_code}' "${hdr[@]}" "$api") ||
            fail "could not reach the GitHub API"
          [ "$code" = 200 ] || fail "GET repo: HTTP $code $(tr -d '\n' < /tmp/repo.json)"
          echo "repo: $GITHUB_REPOSITORY  push permission: $(jq -r '.permissions.push // false' /tmp/repo.json)"

          # 2. release for this tag, creating it when missing
          code=$(curl -sS -o /tmp/rel.json -w '%{http_code}' "${hdr[@]}" "$api/releases/tags/$tag")
          case "$code" in
            200) echo "release $tag already exists" ;;
            404)
              body=$(printf 'arm64 Debian/Devuan package built natively on an arm64 runner from `%s`.\n\nInstall:\n\n```\nsudo apt install ./%s\n```\n\nBuilt against Debian 13 / Devuan excalibur Qt 6 packages.\n' "$tag" "$name")
              jq -n --arg tag "$tag" \
                    --arg name "Sigil $tag (arm64 .deb)" \
                    --arg body "$body" \
                    '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}' \
                > /tmp/newrel.json
              code=$(curl -sS -o /tmp/rel.json -w '%{http_code}' \
                        -H "Content-Type: application/json" --data @/tmp/newrel.json \
                        "${hdr[@]}" "$api/releases")
              [ "$code" = 201 ] || fail "create release $tag: HTTP $code $(tr -d '\n' < /tmp/rel.json)"
              echo "created release $tag" ;;
            *) fail "look up release $tag: HTTP $code $(tr -d '\n' < /tmp/rel.json)" ;;
          esac

          # 3. upload the .deb, replacing an asset of the same name
          rel_id=$(jq -r '.id' /tmp/rel.json)
          old_id=$(jq -r --arg n "$name" '.assets[]? | select(.name == $n) | .id' /tmp/rel.json | head -1)
          if [ -n "${old_id:-}" ]; then
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "${hdr[@]}" "$api/releases/assets/$old_id")
            echo "removed previous asset $old_id (HTTP $code)"
          fi
          code=$(curl -sS -o /tmp/up.json -w '%{http_code}' -X POST \
                    -H "Content-Type: application/octet-stream" --data-binary @"$deb" \
                    "${hdr[@]}" "$api/releases/$rel_id/assets?name=$name")
          [ "$code" = 201 ] || fail "upload $name: HTTP $code $(tr -d '\n' < /tmp/up.json)"
          echo "uploaded $name ($(du -h "$deb" | cut -f1))"
          echo "asset: $(jq -r '.browser_download_url' /tmp/up.json)"
          echo "release: $(jq -r '.html_url' /tmp/rel.json)"
