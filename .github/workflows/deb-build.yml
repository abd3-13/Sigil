name: Build arm64 .deb (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build, also used as the Debian version. Empty = build the calling ref."
        required: false
        type: string
      publish:
        description: "Create/update the GitHub release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  deb-arm64:
    name: .deb (arm64)
    # Native arm64 hosted runner: no qemu, no emulation.
    runs-on: ubuntu-24.04-arm
    # Build inside the same distribution family as the target devices so
    # dependency and library versions line up with Devuan excalibur /
    # Debian 13.
    container: debian:trixie
    steps:
      # actions/checkout needs git inside the container
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkgconf python3-dev \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            qt6-webengine-dev qt6-webengine-dev-tools qt6-l10n-tools qt6-svg-dev \
            libqt6webenginecore6-bin \
            libhunspell-dev libpcre2-dev libminizip-dev zlib1g-dev libssl-dev \
            xz-utils jq \
            xvfb xauth x11-utils libgl1

      - name: Build the package
        env:
          DEB_VERSION: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "DEB_VERSION=${DEB_VERSION:-<default from CMakeLists>}"
          packaging/deb/build-deb.sh
          ls -l dist/

      - name: Smoke test
        run: |
          apt-get install -y --no-install-recommends ./dist/sigil_*.deb
          # every shared library must resolve
          if ldd /usr/lib/*/sigil/sigil | grep -q "not found"; then
            echo "!! unresolved shared libraries:"; ldd /usr/lib/*/sigil/sigil | grep "not found"; exit 1
          fi
          # Sigil has no --version flag: start the GUI on a virtual display and
          # require that it is still alive after 25s (i.e. no startup crash).
          export QTWEBENGINE_DISABLE_SANDBOX=1 LIBGL_ALWAYS_SOFTWARE=1
          Xvfb :99 -screen 0 1400x1000x24 >/tmp/xvfb.log 2>&1 &
          sleep 2
          export DISPLAY=:99
          setsid sigil >/tmp/sigil.log 2>&1 &
          sleep 25
          if ! pgrep -f '/sigil/sigil$' >/dev/null; then
            echo "!! sigil exited during startup"
            echo "----- sigil.log -----"; cat /tmp/sigil.log || true
            echo "----- xvfb.log -----";  cat /tmp/xvfb.log || true
            exit 1
          fi
          echo "OK: sigil is running"
          xwininfo -root -children | head -20 || true
          pkill -f '/sigil/sigil$' || true
          dpkg -s sigil | grep -E "^(Version|Depends|Installed-Size):"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sigil-deb-arm64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub release
        if: inputs.publish && inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Sigil ${{ inputs.tag }} (arm64 .deb)
          body: |
            arm64 Debian/Devuan package built natively on an arm64 runner from
            upstream tag `${{ inputs.tag }}`.

            Install:

            ```
            sudo apt install ./sigil_${{ inputs.tag }}_arm64.deb
            ```

            Built against Debian 13 / Devuan excalibur Qt 6 packages.
          files: dist/*.deb
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Verify the release asset
        if: inputs.publish && inputs.tag != ''
        # Deliberately token-free and jq-free: this checks what a user actually
        # does, i.e. download the asset from the public release URL. Notices and
        # errors are public on the run page, so a failure here is diagnosable
        # without access to the (authenticated) job log.
        run: |
          tag="${{ inputs.tag }}"
          deb=$(ls dist/*.deb | head -1)
          name=$(basename "$deb")
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name"
          echo "::notice::verifying $url"
          code=$(curl -sSL -o /tmp/downloaded.deb -w '%{http_code}' "$url" || echo 000)
          got=$(stat -c %s /tmp/downloaded.deb 2>/dev/null || echo 0)
          want=$(stat -c %s "$deb" 2>/dev/null || echo 0)
          echo "::notice::HTTP $code, downloaded $got bytes, built $want bytes"
          if [ "$code" != "200" ]; then
            echo "::error::$name is not downloadable: HTTP $code from $url"
            exit 1
          fi
          if [ "$got" != "$want" ]; then
            echo "::error::$name size mismatch: release has $got bytes, build produced $want"
            exit 1
          fi
          file /tmp/downloaded.deb
          echo "OK: $tag publishes $name ($got bytes)"
